name: Playwright read-only smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/playwright-readonly.yml'
      - '.github/workflows/full-app-e2e-audit.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      studio_url:
        description: Protected or public AI Studio preview URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-install-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Launch Chromium headless without credentials
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.goto('about:blank');
            if (page.url() !== 'about:blank') throw new Error('Unexpected browser navigation');
            console.log('Chromium headless launch and blank-page navigation passed');
          } finally {
            await browser.close();
          }
          NODE
  product-authoring-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify approved audit origin, trusted main ref and SHA (no secrets)
        env:
          AI_STUDIO_URL: ${{ inputs.studio_url || 'https://oasis-ai-studio.vercel.app' }}
          AI_STUDIO_AUDIT_ALLOWED_ORIGINS: ${{ vars.AI_STUDIO_AUDIT_ALLOWED_ORIGINS }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          PRODUCT_AUTHORING_SAVE: "0"
        run: node scripts/verify-studio-audit-target.mjs
      - name: Verify protected test configuration
        env:
          AI_STUDIO_URL: ${{ inputs.studio_url || 'https://oasis-ai-studio.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$AI_STUDIO_URL" || { echo "AI_STUDIO_URL is not configured"; exit 1; }
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo "Vercel automation bypass is not configured"; exit 1; }
      - name: Run dry-run UX audit
        run: npm run test:product-authoring-audit
        env:
          AI_STUDIO_URL: ${{ inputs.studio_url || 'https://oasis-ai-studio.vercel.app' }}
          AI_STUDIO_AUDIT_ALLOWED_ORIGINS: ${{ vars.AI_STUDIO_AUDIT_ALLOWED_ORIGINS }}
          TEST_STUDIO_EMAIL: ${{ secrets.TEST_STUDIO_EMAIL }}
          TEST_STUDIO_PASSWORD: ${{ secrets.TEST_STUDIO_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PRODUCT_AUTHORING_SAVE: "0"
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: product-authoring-read-only-audit
          path: audit-artifacts/product-authoring
          if-no-files-found: warn
          retention-days: 14
