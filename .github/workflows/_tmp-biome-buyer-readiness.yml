name: Temporary Biome repair

on:
  push:
    branches:
      - feature/buyer-backend-readiness-20261006

permissions:
  contents: write

jobs:
  biome-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feature/buyer-backend-readiness-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Biome only to PR files
        run: |
          npx biome check --write             src/App.tsx             src/components/AppLayout.tsx             src/features/buyerReadiness/model.ts             src/features/buyerReadiness/model.test.ts             src/lib/modulePurpose.ts             src/pages/BuyerBackendReadiness.tsx
      - name: Commit scoped formatter repairs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/App.tsx             src/components/AppLayout.tsx             src/features/buyerReadiness/model.ts             src/features/buyerReadiness/model.test.ts             src/lib/modulePurpose.ts             src/pages/BuyerBackendReadiness.tsx
          git commit -m "style(studio): apply Biome to Buyer readiness changes"
          git push origin HEAD:feature/buyer-backend-readiness-20261006
